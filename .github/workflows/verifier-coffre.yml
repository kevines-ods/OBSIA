name: Vérifier le coffre

# Le contrat pose des règles que rien ne contrôlait. Ce workflow les fait
# respecter : frontmatters valides, références d'agents existantes, index et
# sommaires à jour vis-à-vis des fichiers dont ils dérivent.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Aucune dépendance : les scripts du coffre n'utilisent que la
      # bibliothèque standard, à dessein.
      - name: Cohérence du coffre
        run: python3 scripts/verifier_coffre.py

      # Le contrôle du déclenchement : la description d'un skill porte-t-elle
      # les mots que l'utilisateur emploie, et deux descriptions se
      # marchent-elles dessus ? Voir VAULT-CONTRACT.md §11.
      - name: Routage des skills
        run: python3 scripts/evaluer_routage.py

      - name: Le prompt système se génère
        run: python3 scripts/generer_prompt.py > /dev/null

      # Sans --appliquer, il n'écrit rien : c'est un simple aperçu. Le script
      # appartient au module `planification` (§13) : une installation qui l'a
      # écarté n'a rien à lire, et ce n'est pas un échec.
      - name: Le registre des tâches se lit
        run: |
          if [ -f IA/skills/cron/scripts/appliquer_taches.py ]; then
            python3 IA/skills/cron/scripts/appliquer_taches.py > /dev/null
          else
            echo "Module planification écarté — rien à lire."
          fi

      # L'installeur doit rester capable de lire le catalogue et de sonder la
      # machine. --sonder n'écrit rien et ne touche pas au réseau (§13.2).
      - name: L'installeur lit le catalogue
        run: python3 scripts/installer.py --sonder > /dev/null
